<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>부부 완료 현황 — 우리가족 올인원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#FAF8F5', surface: '#FFFFFF', 'surface-muted': '#F1ECE4',
          foreground: '#2B2A28', 'foreground-muted': '#5C5852', border: '#E7DFD3',
          primary: '#0055FF', 'primary-dark': '#0044CC', 'on-primary': '#FFFFFF',
          secondary: '#2E7D32', 'secondary-dark': '#1B4D3A', 'on-secondary': '#FFFFFF',
          accent: '#C2185B', 'on-accent': '#FFFFFF',
          destructive: '#C6483B', 'on-destructive': '#FFFFFF', ring: '#0055FF',
          'member-1': '#0055FF', 'member-2': '#C2185B', 'member-3': '#2E7D32', 'member-4': '#6A4C93',
          'tape-blue': '#0055FF', 'tape-lime': '#4CAF50', 'tape-yellow': '#FFD100', 'tape-pink': '#FF85A1',
        },
        fontFamily: {
          display: ["'Nanum Gothic'", "'Varela Round'", 'sans-serif'],
          body: ["'Gowun Dodum'", "'Nunito Sans'", 'sans-serif'],
          doodle: ["'Gaegu'", 'cursive'],
        },
        borderRadius: { sm: '10px', md: '16px', lg: '20px' },
        boxShadow: {
          soft: '0 2px 8px rgba(43,42,40,0.06), 0 8px 24px rgba(43,42,40,0.08)',
          sticker: '4px 4px 0 0 #2B2A28',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Gowun Dodum', 'Nunito Sans', sans-serif; }
  .font-display { font-family: 'Nanum Gothic', 'Varela Round', sans-serif; }
  .font-doodle { font-family: 'Gaegu', cursive; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0055FF; outline-offset: 2px; border-radius: inherit; }
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-6" style="padding-top: max(1.5rem, calc(1rem + env(safe-area-inset-top))); padding-bottom: max(5.5rem, calc(4.5rem + env(safe-area-inset-bottom)));">

    <header class="flex items-center justify-between px-1 py-2 mb-6 border-b border-border">
      <span class="font-display font-extrabold text-2xl text-secondary">Kinship</span>
      <div class="flex items-center gap-4 text-foreground-muted">
        <i class="ph ph-globe text-xl" aria-hidden="true"></i>
        <i class="ph ph-user-circle text-xl" aria-hidden="true"></i>
      </div>
    </header>

    <div class="flex items-center justify-between mb-6">
      <a href="parent-tasks.html" class="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition duration-150" aria-label="할일 리스트로">
        <i class="ph-bold ph-caret-left text-xl text-foreground-muted"></i>
      </a>
      <span class="font-display font-bold text-[15px] text-foreground-muted">완료 현황</span>
      <div class="w-10"></div>
    </div>

    <div class="mb-8">
      <h1 class="font-display font-extrabold text-[28px] leading-[34px]">오늘 우리 둘 다<br><span class="bg-tape-yellow px-1 -mx-1 rounded-sm">확인했어요</span></h1>
      <p class="text-foreground-muted text-[15px] leading-[22px] mt-2">한쪽만 하고 다른 쪽은 모르는 일이 없도록, 서로의 진행을 같이 봐요.</p>
    </div>

    <!-- 부부 진행 트랙 -->
    <div class="relative bg-surface border-2 border-foreground rounded-md shadow-sticker p-card-padding mb-6 active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
      <span class="absolute -top-2 left-8 w-12 h-5 bg-tape-lime/90 rotate-[-3deg] rounded-sm shadow-sm" aria-hidden="true"></span>
      <div class="relative h-14 mb-4">
        <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1.5 bg-surface-muted rounded-full"></div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center">
          <i class="ph-fill ph-target text-lg text-primary"></i>
        </div>
        <div class="absolute left-1/2 -top-1 -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-secondary ring-2 ring-surface flex items-center justify-center rotate-[-10deg]" style="box-shadow: 0 0 10px rgba(46,125,50,0.55)" aria-hidden="true">
          <i class="ph-bold ph-check text-on-secondary text-sm"></i>
        </div>
        <div class="absolute top-1/2 -translate-y-1/2 transition-all duration-500 [transition-timing-function:cubic-bezier(0.16,1,0.3,1)]" style="left: 29%;">
          <div class="w-11 h-11 rounded-full bg-member-3 ring-4 ring-surface flex items-center justify-center -translate-x-1/2 shadow-soft">
            <span class="font-display font-bold text-on-primary text-[13px]">서연</span>
          </div>
        </div>
        <div class="absolute top-1/2 -translate-y-1/2 transition-all duration-500 [transition-timing-function:cubic-bezier(0.16,1,0.3,1)]" style="right: 29%;">
          <div class="w-11 h-11 rounded-full bg-member-4 ring-4 ring-surface flex items-center justify-center translate-x-1/2 shadow-soft">
            <span class="font-display font-bold text-on-primary text-[13px]">민준</span>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between text-[15px]">
        <span class="font-display font-bold text-member-3">서연 · 1/2 완료</span>
        <span class="font-display font-bold text-member-4">민준 · 1/2 완료</span>
      </div>
    </div>

    <!-- 미완료 항목 -->
    <p class="font-display font-bold text-[13px] tracking-wide text-foreground-muted mb-3">아직 안 끝난 일</p>
    <div class="flex flex-col gap-3">
      <div class="bg-surface border-2 border-accent rounded-lg shadow-soft px-4 py-4 flex items-center gap-3">
        <i class="ph-fill ph-warning-circle text-2xl text-accent shrink-0"></i>
        <div class="flex-1">
          <p class="font-display font-bold text-[16px]">장보기 — 우유, 계란</p>
          <p class="text-[13px] text-foreground-muted mt-0.5">민준 담당 · 아직 미완료</p>
        </div>
        <span class="w-8 h-8 rounded-full bg-member-4 ring-2 ring-surface shadow-soft flex items-center justify-center text-[11px] font-display font-bold text-on-primary">민</span>
      </div>
      <div class="bg-surface border-2 border-accent rounded-lg shadow-soft px-4 py-4 flex items-center gap-3">
        <i class="ph-fill ph-warning-circle text-2xl text-accent shrink-0"></i>
        <div class="flex-1">
          <p class="font-display font-bold text-[16px]">하준 태권도 준비물 챙기기</p>
          <p class="text-[13px] text-foreground-muted mt-0.5">서연 담당 · 아직 미완료</p>
        </div>
        <span class="w-8 h-8 rounded-full bg-member-3 ring-2 ring-surface shadow-soft flex items-center justify-center text-[11px] font-display font-bold text-on-primary">서</span>
      </div>
    </div>

    <div class="flex-1"></div>
    <div class="flex items-center justify-center gap-2 mb-1" aria-hidden="true">
      <i class="ph-duotone ph-coffee text-xl text-member-4 rotate-[-6deg]"></i>
      <span class="font-doodle text-[14px] text-foreground-muted">오늘도 고생했어요</span>
    </div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/bottomnav.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
