<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>오늘의 옷차림 — 우리가족 올인원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#FAF8F5', surface: '#FFFFFF', 'surface-muted': '#F1ECE4',
          foreground: '#2B2A28', 'foreground-muted': '#5C5852', border: '#E7DFD3',
          primary: '#0055FF', 'primary-dark': '#0044CC', 'on-primary': '#FFFFFF',
          secondary: '#2E7D32', 'secondary-dark': '#1B4D3A', 'on-secondary': '#FFFFFF',
          accent: '#C2185B', 'on-accent': '#FFFFFF',
          destructive: '#C6483B', 'on-destructive': '#FFFFFF', ring: '#0055FF',
          'member-1': '#0055FF', 'member-2': '#C2185B', 'member-3': '#2E7D32', 'member-4': '#6A4C93',
          'tape-blue': '#0055FF', 'tape-lime': '#4CAF50', 'tape-yellow': '#FFD100', 'tape-pink': '#FF85A1',
        },
        fontFamily: {
          display: ["'Nanum Gothic'", "'Varela Round'", 'sans-serif'],
          body: ["'Gowun Dodum'", "'Nunito Sans'", 'sans-serif'],
          doodle: ["'Gaegu'", 'cursive'],
        },
        borderRadius: { sm: '10px', md: '16px', lg: '20px' },
        boxShadow: {
          soft: '0 2px 8px rgba(43,42,40,0.06), 0 8px 24px rgba(43,42,40,0.08)',
          sticker: '4px 4px 0 0 #2B2A28',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Gowun Dodum', 'Nunito Sans', sans-serif; }
  .font-display { font-family: 'Nanum Gothic', 'Varela Round', sans-serif; }
  .font-doodle { font-family: 'Gaegu', cursive; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0055FF; outline-offset: 2px; border-radius: inherit; }

  /* 날씨/옷차림 생동감 모션 */
  @keyframes icon-sway { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
  .icon-sway { animation: icon-sway 3.2s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes tape-wiggle { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(9deg); } }
  .tape-wiggle { animation: tape-wiggle 2.6s ease-in-out infinite; }
  @keyframes item-pop-in { 0% { opacity: 0; transform: translateY(10px) scale(0.82); } 60% { opacity: 1; transform: translateY(-2px) scale(1.05); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .item-pop-in { animation: item-pop-in 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-6" style="padding-top: max(1.5rem, calc(1rem + env(safe-area-inset-top))); padding-bottom: max(5.5rem, calc(4.5rem + env(safe-area-inset-bottom)));">

    <!-- 공용 상단 헤더 -->
    <header class="flex items-center justify-between px-1 py-2 mb-6 border-b border-border">
      <span class="font-doodle font-bold text-[19px] text-foreground" id="header-date"></span>
      <div class="flex items-center gap-4 text-foreground-muted">
        <i class="ph ph-globe text-xl" aria-hidden="true"></i>
        <i class="ph ph-user-circle text-xl" aria-hidden="true"></i>
      </div>
    </header>

    <!-- 날씨 카드 -->
    <div class="bg-surface-muted rounded-lg p-card-padding mb-6 flex items-center justify-between gap-4">
      <div>
        <p class="font-display font-bold text-[19px] leading-snug" id="weather-date">오늘 날씨 · 불러오는 중...</p>
        <p class="text-[15px] text-foreground-muted mt-1" id="weather-temp">--°C</p>
        <p class="text-[11px] text-foreground-muted/70 mt-2" id="weather-source-note"></p>
      </div>
      <div class="text-center shrink-0">
        <i class="ph-duotone ph-cloud-sun text-5xl text-primary icon-sway" id="weather-icon"></i>
        <p class="text-[13px] font-display font-bold text-foreground-muted mt-1" id="weather-desc">날씨 정보를 불러오는 중이에요...</p>
      </div>
    </div>

    <!-- 요일별 지정복 -->
    <p class="mb-3">
      <span class="font-display font-bold text-[15px] text-foreground bg-tape-yellow/70 px-1 -rotate-1 inline-block">오늘의 지정복</span>
    </p>
    <div class="relative bg-accent border-2 border-foreground rounded-md shadow-sticker p-6 mb-6 overflow-visible">
      <i class="ph-fill ph-person-simple-run absolute -top-3 -right-2 text-2xl text-primary rotate-[-8deg]" aria-hidden="true"></i>
      <i class="ph-fill ph-soccer-ball absolute -bottom-3 -left-2 text-2xl text-foreground" aria-hidden="true"></i>
      <p class="font-display font-bold text-[19px] leading-snug text-center text-on-accent" id="outfit-banner-text">오늘의 지정복을 확인하고 있어요...</p>
      <div class="flex items-center justify-center gap-4 mt-4">
        <div class="w-16 h-16 rounded-full bg-surface-muted ring-4 ring-surface shadow-soft flex items-center justify-center" data-photo-slot="pe-uniform-top">
          <i class="ph-duotone ph-shirt-folded text-3xl text-secondary" aria-hidden="true"></i>
        </div>
        <div class="w-16 h-16 rounded-full bg-surface-muted ring-4 ring-surface shadow-soft flex items-center justify-center" data-photo-slot="pe-uniform-bottom">
          <i class="ph-duotone ph-pants text-3xl text-primary" aria-hidden="true"></i>
        </div>
      </div>
    </div>

    <!-- 추천 옷차림 (플랫레이 스타일) -->
    <div class="flex-1">
      <p class="font-display font-bold text-[17px] text-secondary mb-1 relative inline-block">
        추천 옷차림
        <svg class="absolute left-0 -bottom-1 w-full h-2 pointer-events-none" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
          <path d="M2,6 C20,2 35,9 50,5 C65,1 80,8 98,4" fill="none" stroke="#0055FF" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </p>
      <div class="relative pt-6 pb-2">
        <i class="ph-fill ph-sparkle absolute top-2 left-4 text-xl text-tape-pink rotate-[-8deg]" aria-hidden="true"></i>
        <i class="ph-duotone ph-shirt-folded absolute bottom-0 right-8 text-lg text-primary rotate-[10deg]" aria-hidden="true"></i>

        <div class="flex items-start justify-center gap-4 flex-wrap pt-6 pb-2" id="outfit-items"></div>

        <p class="font-display font-bold text-[17px] mb-1 text-center mt-4" id="outfit-title">불러오는 중...</p>
        <p class="text-[15px] text-foreground-muted leading-[22px] text-center px-2" id="outfit-note"></p>
      </div>
    </div>

    <!-- 확인 버튼 -->
    <a href="child-todo.html"
       class="mt-6 bg-secondary-dark text-on-secondary border-2 border-foreground rounded-md shadow-sticker py-4 flex items-center justify-center gap-2 font-display font-bold text-[17px] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
      확인했어요!
      <i class="ph-bold ph-arrow-right text-lg"></i>
    </a>
  </div>
  <script src="js/store.js"></script>
  <script src="js/header.js"></script>
  <script src="js/config.js"></script>
  <script src="js/weather.js"></script>
  <script>
    (function () {
      var CHILD_NAME = '하준';
      var DAY_LABEL = { sun: '일요일', mon: '월요일', tue: '화요일', wed: '수요일', thu: '목요일', fri: '금요일', sat: '토요일' };

      var EXTRA_ICON = { '우비': 'ph-umbrella', '겉옷': 'ph-jacket', '얇은 여벌옷': 'ph-shirt-folded' };

      function outfitCard(iconClass, label, slot, rotateClass, offsetClass, delay) {
        return '' +
          '<div class="relative bg-surface rounded-md shadow-soft p-2 pb-3 w-28 flex-shrink-0 flex flex-col items-center gap-2 item-pop-in ' + rotateClass + ' ' + offsetClass + '" style="animation-delay: ' + delay + 's">' +
            '<div class="w-full aspect-square rounded-sm bg-surface-muted flex items-center justify-center" data-photo-slot="' + slot + '">' +
              '<i class="ph-duotone ' + iconClass + ' text-4xl text-foreground-muted" aria-hidden="true"></i>' +
            '</div>' +
            '<span class="font-display font-bold text-[13px] text-foreground text-center">' + label + '</span>' +
          '</div>';
      }

      function renderOutfitItems(rec) {
        var wrap = document.getElementById('outfit-items');
        var cards = [outfitCard('ph-shirt-folded', rec.main, 'outfit-item-main', '-rotate-3', '-translate-y-1', 0.1)];
        if (rec.extra) {
          cards.push(outfitCard(EXTRA_ICON[rec.extra.name] || 'ph-shirt-folded', rec.extra.name, 'outfit-item-extra', 'rotate-3', 'translate-y-2', 0.28));
        }
        wrap.innerHTML = cards.join('');
      }

      function render() {
        var todayKey = OFStore.outfit.todayKey();
        var rule = OFStore.outfit.getRule(CHILD_NAME, todayKey);
        var outfitType = rule ? rule.outfitType : '평상복';
        document.getElementById('outfit-banner-text').textContent = '오늘은 ' + DAY_LABEL[todayKey] + ' — ' + outfitType + ' 입는 날이에요';

        OFWeather.getToday().then(function (weather) {
          document.getElementById('weather-date').textContent = '오늘 날씨 · ' + weather.dateLabel;
          document.getElementById('weather-temp').textContent = weather.tempC + '°C';
          document.getElementById('weather-desc').textContent = weather.description;
          document.getElementById('weather-source-note').textContent = window.OF_CONFIG.weatherApiKey ? '기상청 공공데이터포털 제공' : '실제 기상청 API 연동 전 · 임시 데이터';

          var rec = OFWeather.buildRecommendation(outfitType, weather);
          renderOutfitItems(rec);
          document.getElementById('outfit-title').textContent = rec.title;
          document.getElementById('outfit-note').textContent = rec.note;
        }).catch(function (err) {
          document.getElementById('weather-desc').textContent = err.message;
        });
      }

      OFStore.onChange(render);
      render();
    })();
  </script>
  <script src="js/bottomnav.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
