<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>우리가족 올인원 — 누구세요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#FAF8F5', surface: '#FFFFFF', 'surface-muted': '#F1ECE4',
          foreground: '#2B2A28', 'foreground-muted': '#5C5852', border: '#E7DFD3',
          primary: '#0055FF', 'primary-dark': '#0044CC', 'on-primary': '#FFFFFF',
          secondary: '#2E7D32', 'secondary-dark': '#1B4D3A', 'on-secondary': '#FFFFFF',
          accent: '#C2185B', 'on-accent': '#FFFFFF',
          destructive: '#C6483B', 'on-destructive': '#FFFFFF', ring: '#0055FF',
          'member-1': '#0055FF', 'member-2': '#C2185B', 'member-3': '#2E7D32', 'member-4': '#6A4C93',
          'tape-blue': '#0055FF', 'tape-lime': '#4CAF50', 'tape-yellow': '#FFD100', 'tape-pink': '#FF85A1',
          'pastel-mint': '#BFEAD1', 'pastel-sky': '#BEE7F5',
        },
        fontFamily: {
          display: ["'Nanum Gothic'", "'Varela Round'", 'sans-serif'],
          body: ["'Gowun Dodum'", "'Nunito Sans'", 'sans-serif'],
          doodle: ["'Gaegu'", 'cursive'],
        },
        borderRadius: { sm: '10px', md: '16px', lg: '20px' },
        boxShadow: {
          soft: '0 2px 8px rgba(43,42,40,0.06), 0 8px 24px rgba(43,42,40,0.08)',
          sticker: '4px 4px 0 0 #2B2A28',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Gowun Dodum', 'Nunito Sans', sans-serif; }
  .font-display { font-family: 'Nanum Gothic', 'Varela Round', sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0055FF; outline-offset: 2px; border-radius: inherit; }
  .bubble-text {
    font-family: 'Nanum Gothic', sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #6B9BFF 0%, #0055FF 55%, #0044CC 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.55);
    filter: drop-shadow(0 3px 0 rgba(0,68,204,0.3)) drop-shadow(0 8px 14px rgba(43,42,40,0.18));
  }
  .canvas-texture {
    background-image:
      radial-gradient(circle at 18% 28%, rgba(43,42,40,0.035) 0, transparent 45%),
      radial-gradient(circle at 82% 72%, rgba(43,42,40,0.035) 0, transparent 45%),
      radial-gradient(circle at 50% 92%, rgba(43,42,40,0.025) 0, transparent 40%);
  }

  /* 히어로 콜라주 생동감 모션 */
  @keyframes twinkle { 0%, 100% { opacity: 0.75; transform: rotate(var(--r, 0deg)) scale(0.92); } 50% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1.18); } }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes avatar-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .avatar-bob { display: inline-flex; animation: avatar-bob 2.8s ease-in-out infinite; }
  @keyframes wordmark-in { 0% { opacity: 0; transform: scale(0.85) translateY(6px); } 60% { opacity: 1; transform: scale(1.05) translateY(-2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  .wordmark-in { animation: wordmark-in 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-6" style="padding-top: max(2rem, calc(1rem + env(safe-area-inset-top))); padding-bottom: max(5.5rem, calc(4.5rem + env(safe-area-inset-bottom)));">

    <!-- 공용 상단 헤더 -->
    <header class="flex items-center justify-between px-1 py-2 mb-6 border-b border-border">
      <span class="font-doodle font-bold text-[19px] text-foreground" id="header-date"></span>
      <div class="flex items-center gap-4 text-foreground-muted">
        <i class="ph ph-globe text-xl" aria-hidden="true"></i>
        <i class="ph ph-user-circle text-xl" aria-hidden="true"></i>
      </div>
    </header>

    <!-- 헤드라인 -->
    <div class="mb-8">
      <span class="inline-block w-3 h-3 rounded-full bg-accent mb-3" aria-hidden="true"></span>
      <h1 class="font-display font-extrabold text-[28px] leading-[34px]">누가 확인할까요?</h1>
      <p class="text-foreground-muted text-[15px] leading-[22px] mt-2">이름을 누르면 그 사람에게 필요한 화면으로 바로 이동해요.</p>
    </div>

    <!-- 자녀 카드 목록 -->
    <div class="mb-8">
      <p class="font-display font-bold text-[13px] tracking-wide text-foreground-muted mb-3">우리 아이</p>
      <div class="grid grid-cols-2 gap-4">
        <a href="child-outfit.html" class="relative bg-pastel-mint text-foreground border-2 border-foreground rounded-md shadow-sticker p-5 pt-8 flex flex-col items-center gap-3 overflow-hidden active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150 rotate-[-1deg] aspect-square justify-between">
          <div class="w-20 h-20 rounded-full bg-surface ring-4 ring-surface shadow-soft flex items-center justify-center" data-photo-slot="member-avatar-하준">
            <i class="ph-duotone ph-baseball-cap text-4xl text-member-1"></i>
          </div>
          <span class="font-display font-bold text-[18px] self-start">하준</span>
          <i class="ph-fill ph-smiley absolute bottom-4 right-4 text-lg text-foreground/40" aria-hidden="true"></i>
        </a>
        <a href="child-outfit.html" class="relative bg-pastel-sky text-foreground border-2 border-foreground rounded-md shadow-sticker p-5 pt-8 flex flex-col items-center gap-3 overflow-hidden active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150 aspect-square justify-between">
          <i class="ph-fill ph-star absolute -top-2 right-6 text-2xl text-surface rotate-[12deg]" aria-hidden="true" style="-webkit-text-stroke: 2px #2B2A28;"></i>
          <div class="w-20 h-20 rounded-full bg-surface ring-4 ring-surface shadow-soft flex items-center justify-center" data-photo-slot="member-avatar-서아">
            <i class="ph-duotone ph-flower-tulip text-4xl text-member-2"></i>
          </div>
          <span class="font-display font-bold text-[18px] self-start">서아</span>
        </a>
      </div>
    </div>

    <!-- 구분 -->
    <div class="flex items-center gap-3 mb-6">
      <div class="flex-1 h-px bg-border"></div>
      <span class="text-foreground-muted text-[13px]">또는</span>
      <div class="flex-1 h-px bg-border"></div>
    </div>

    <!-- 부모 버튼 -->
    <a href="parent-recipe.html" class="bg-secondary-dark text-on-secondary border-2 border-foreground rounded-md shadow-sticker px-5 py-4 flex items-center justify-between active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
      <span class="flex items-center gap-3">
        <i class="ph-duotone ph-users-three text-2xl"></i>
        <span class="font-display font-bold text-[17px]">부모로 시작하기</span>
      </span>
      <i class="ph-bold ph-caret-right text-xl"></i>
    </a>

    <div class="flex-1"></div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/header.js"></script>
  <script src="js/bottomnav.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
