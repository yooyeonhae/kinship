<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>오늘의 저녁 레시피 — 우리가족 올인원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#FAF8F5', surface: '#FFFFFF', 'surface-muted': '#F1ECE4',
          foreground: '#2B2A28', 'foreground-muted': '#5C5852', border: '#E7DFD3',
          primary: '#0055FF', 'primary-dark': '#0044CC', 'on-primary': '#FFFFFF',
          secondary: '#2E7D32', 'on-secondary': '#FFFFFF',
          accent: '#C2185B', 'on-accent': '#FFFFFF',
          destructive: '#C6483B', 'on-destructive': '#FFFFFF', ring: '#0055FF',
          'member-1': '#0055FF', 'member-2': '#C2185B', 'member-3': '#2E7D32', 'member-4': '#6A4C93',
          'tape-blue': '#0055FF', 'tape-lime': '#4CAF50', 'tape-yellow': '#FFD100', 'tape-pink': '#FF85A1',
        },
        fontFamily: {
          display: ["'Nanum Gothic'", "'Varela Round'", 'sans-serif'],
          body: ["'Gowun Dodum'", "'Nunito Sans'", 'sans-serif'],
          doodle: ["'Gaegu'", 'cursive'],
        },
        borderRadius: { sm: '10px', md: '16px', lg: '20px' },
        boxShadow: {
          soft: '0 2px 8px rgba(43,42,40,0.06), 0 8px 24px rgba(43,42,40,0.08)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Gowun Dodum', 'Nunito Sans', sans-serif; }
  .font-display { font-family: 'Nanum Gothic', 'Varela Round', sans-serif; }
  .font-doodle { font-family: 'Gaegu', cursive; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0055FF; outline-offset: 2px; border-radius: inherit; }
  .wood-counter {
    background: linear-gradient(155deg, #E8D3AC 0%, #D9BE8D 55%, #CBAB77 100%);
    background-image:
      linear-gradient(155deg, #E8D3AC 0%, #D9BE8D 55%, #CBAB77 100%),
      repeating-linear-gradient(100deg, rgba(43,42,40,0.05) 0px, rgba(43,42,40,0.05) 1px, transparent 1px, transparent 14px);
  }
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-6" style="padding-top: max(1.5rem, calc(1rem + env(safe-area-inset-top))); padding-bottom: max(5.5rem, calc(4.5rem + env(safe-area-inset-bottom)));">

    <div class="flex items-center justify-between mb-6">
      <a href="entry.html" class="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition duration-150" aria-label="처음으로">
        <i class="ph-bold ph-caret-left text-xl text-foreground-muted"></i>
      </a>
      <span class="font-display font-bold text-[15px] text-foreground-muted">부모 · 서연</span>
      <div class="w-10"></div>
    </div>

    <div class="mb-6">
      <h1 class="font-display font-extrabold text-[28px] leading-[34px]">오늘 저녁, 뭐 먹지?</h1>
      <p class="text-foreground-muted text-[15px] leading-[22px] mt-2">냉장고 재료로 바로 만들 수 있는 두 가지를 골라봤어요.</p>
    </div>

    <!-- 오늘의 재료 놀링 사진 (실제 사진 대신 재료 스와치로 표현) -->
    <div class="wood-counter relative rounded-lg shadow-soft p-5 mb-6 overflow-hidden">
      <span class="absolute top-3 right-6 -rotate-[8deg] bg-surface border border-border rounded-sm shadow-sm px-3 py-1" aria-hidden="false">
        <span class="font-doodle text-[15px] text-accent">오늘의 재료</span>
      </span>

      <!-- 폰 카메라 아이콘 (위에서 찍는 느낌) -->
      <div class="flex justify-center mb-4 mt-2">
        <div class="w-14 h-14 rounded-full bg-surface/90 ring-2 ring-surface shadow-soft flex items-center justify-center">
          <i class="ph-duotone ph-camera text-2xl text-foreground"></i>
        </div>
      </div>

      <!-- 손그림 화살표: 폰 -> 재료들 -->
      <svg class="absolute left-1/2 top-14 w-24 h-10 -translate-x-1/2 pointer-events-none" viewBox="0 0 100 40" aria-hidden="true">
        <path d="M50,2 C40,14 20,18 10,28" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
        <path d="M50,2 C58,14 78,18 88,28" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
      </svg>

      <!-- 재료 놀링(knolling) 배치 -->
      <div class="relative flex items-end justify-center gap-6 pt-6">
        <div class="flex flex-col items-center gap-1.5">
          <span class="w-11 h-11 rounded-full shadow-soft ring-2 ring-surface" style="background:#D6483B" aria-hidden="true"></span>
          <span class="font-doodle text-[13px] text-foreground">토마토</span>
        </div>
        <div class="flex flex-col items-center gap-1.5 -mt-2">
          <span class="w-11 h-11 rounded-full shadow-soft ring-2 ring-surface flex items-center justify-center" style="background:#4CAF50" aria-hidden="true">
            <i class="ph-fill ph-leaf text-on-secondary text-sm"></i>
          </span>
          <span class="font-doodle text-[13px] text-foreground">바질</span>
        </div>
        <div class="flex flex-col items-center gap-1.5">
          <span class="w-11 h-11 rounded-full shadow-soft ring-2 ring-surface" style="background:#FFD100" aria-hidden="true"></span>
          <span class="font-doodle text-[13px] text-foreground">피망</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-5">
      <!-- 레시피 카드 1 -->
      <div class="relative">
        <span class="absolute -top-2 left-8 z-10 w-14 h-5 bg-tape-yellow/90 rotate-[-4deg] rounded-sm shadow-sm" aria-hidden="true"></span>
        <div class="bg-surface border border-border rounded-lg shadow-soft overflow-hidden">
          <div class="h-32 bg-primary/10 flex items-center justify-center">
            <i class="ph-duotone ph-bowl-food text-6xl text-primary"></i>
          </div>
          <div class="p-card-padding">
            <p class="font-display font-bold text-[13px] tracking-wide text-primary mb-1">15분 · 재료 4개</p>
            <h2 class="font-display font-extrabold text-[20px] mb-2">된장찌개 정식</h2>
            <p class="text-[15px] text-foreground-muted leading-[22px] mb-4">두부, 애호박, 감자만 있으면 충분해요.</p>
            <a href="#" class="flex items-center justify-center gap-2 bg-accent text-on-accent rounded-md py-3 font-display font-bold text-[15px] active:scale-[0.97] transition duration-150">
              <i class="ph-duotone ph-video"></i>
              즐겨찾기 레시피 영상 보기
            </a>
          </div>
        </div>
      </div>

      <!-- 레시피 카드 2 -->
      <div class="relative rotate-[1deg]">
        <div class="bg-surface border border-border rounded-lg shadow-soft overflow-hidden">
          <div class="h-32 bg-secondary/10 flex items-center justify-center">
            <i class="ph-duotone ph-cooking-pot text-6xl text-secondary"></i>
          </div>
          <div class="p-card-padding">
            <p class="font-display font-bold text-[13px] tracking-wide text-secondary mb-1">20분 · 재료 5개</p>
            <h2 class="font-display font-extrabold text-[20px] mb-2">소불고기 덮밥</h2>
            <p class="text-[15px] text-foreground-muted leading-[22px] mb-4">양파, 당근을 잘게 썰어 함께 볶기만 하면 돼요.</p>
            <a href="#" class="flex items-center justify-center gap-2 bg-accent text-on-accent rounded-md py-3 font-display font-bold text-[15px] active:scale-[0.97] transition duration-150">
              <i class="ph-duotone ph-video"></i>
              즐겨찾기 레시피 영상 보기
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="flex-1"></div>

    <a href="parent-tasks.html"
       class="mt-6 bg-primary text-on-primary rounded-lg shadow-soft py-4 flex items-center justify-center gap-2 font-display font-bold text-[17px] active:scale-[0.97] transition duration-150 [transition-timing-function:cubic-bezier(0.16,1,0.3,1)]">
      확인했어요
      <i class="ph-bold ph-arrow-right text-lg"></i>
    </a>
  </div>
  <script src="js/store.js"></script>
  <script src="js/bottomnav.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
