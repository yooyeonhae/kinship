<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>오늘의 저녁 레시피 — 우리가족 올인원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#FAF8F5', surface: '#FFFFFF', 'surface-muted': '#F1ECE4',
          foreground: '#2B2A28', 'foreground-muted': '#5C5852', border: '#E7DFD3',
          primary: '#0055FF', 'primary-dark': '#0044CC', 'on-primary': '#FFFFFF',
          secondary: '#2E7D32', 'secondary-dark': '#1B4D3A', 'on-secondary': '#FFFFFF',
          accent: '#C2185B', 'on-accent': '#FFFFFF',
          destructive: '#C6483B', 'on-destructive': '#FFFFFF', ring: '#0055FF',
          'member-1': '#0055FF', 'member-2': '#C2185B', 'member-3': '#2E7D32', 'member-4': '#6A4C93',
          'tape-blue': '#0055FF', 'tape-lime': '#4CAF50', 'tape-yellow': '#FFD100', 'tape-pink': '#FF85A1',
        },
        fontFamily: {
          display: ["'Nanum Gothic'", "'Varela Round'", 'sans-serif'],
          body: ["'Gowun Dodum'", "'Nunito Sans'", 'sans-serif'],
          doodle: ["'Gaegu'", 'cursive'],
        },
        borderRadius: { sm: '10px', md: '16px', lg: '20px' },
        boxShadow: {
          soft: '0 2px 8px rgba(43,42,40,0.06), 0 8px 24px rgba(43,42,40,0.08)',
          sticker: '4px 4px 0 0 #2B2A28',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Gowun Dodum', 'Nunito Sans', sans-serif; }
  .font-display { font-family: 'Nanum Gothic', 'Varela Round', sans-serif; }
  .font-doodle { font-family: 'Gaegu', cursive; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0055FF; outline-offset: 2px; border-radius: inherit; }
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-6" style="padding-top: max(1.5rem, calc(1rem + env(safe-area-inset-top))); padding-bottom: max(5.5rem, calc(4.5rem + env(safe-area-inset-bottom)));">

    <header class="flex items-center justify-between px-1 py-2 mb-6 border-b border-border">
      <span class="font-display font-extrabold text-2xl text-secondary">Kinship</span>
      <div class="flex items-center gap-4 text-foreground-muted">
        <i class="ph ph-globe text-xl" aria-hidden="true"></i>
        <i class="ph ph-user-circle text-xl" aria-hidden="true"></i>
      </div>
    </header>

    <div class="mb-6">
      <h1 class="font-display font-extrabold text-[28px] leading-[34px]">퇴근 길 메뉴 고민은 그만!</h1>
      <p class="flex items-center gap-1.5 text-foreground-muted text-[15px] leading-[22px] mt-2">
        오늘의 추천 메뉴입니다
        <i class="ph-fill ph-heart text-accent text-base" aria-hidden="true"></i>
      </p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- 레시피 카드 1 -->
      <div class="-rotate-1 bg-surface border-2 border-foreground rounded-md shadow-sticker active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
        <div class="relative">
          <div class="aspect-[4/3] rounded-t-[14px] overflow-hidden bg-surface-muted flex items-center justify-center" data-photo-slot="recipe-doenjang">
            <i class="ph-duotone ph-bowl-food text-6xl text-foreground-muted" aria-hidden="true"></i>
          </div>
          <span class="absolute -bottom-3 right-3 w-8 h-8 rounded-full bg-accent ring-4 ring-surface shadow-soft flex items-center justify-center" aria-hidden="true">
            <i class="ph-fill ph-star text-on-accent text-xs"></i>
          </span>
        </div>
        <div class="p-3 pt-4">
          <h2 class="font-display font-extrabold text-[15px] leading-tight mb-1">된장찌개 정식</h2>
          <p class="text-[12px] text-foreground-muted leading-snug mb-2 line-clamp-2">두부, 애호박, 감자만 있으면 충분해요.</p>
          <div class="border-t border-dashed border-border pt-2 flex items-center justify-between">
            <span class="inline-flex items-center gap-1 text-[11px] font-display font-bold text-primary">
              <i class="ph-bold ph-clock"></i>15분
            </span>
            <i class="ph ph-heart text-foreground-muted text-base" aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <!-- 레시피 카드 2 -->
      <div class="rotate-2 bg-surface border-2 border-foreground rounded-md shadow-sticker active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
        <div class="relative">
          <div class="aspect-[4/3] rounded-t-[14px] overflow-hidden bg-surface-muted flex items-center justify-center" data-photo-slot="recipe-bulgogi">
            <i class="ph-duotone ph-cooking-pot text-6xl text-foreground-muted" aria-hidden="true"></i>
          </div>
          <span class="absolute -top-3 left-3 w-8 h-8 rounded-full bg-primary ring-4 ring-surface shadow-soft flex items-center justify-center" aria-hidden="true">
            <i class="ph-fill ph-star text-on-primary text-xs"></i>
          </span>
        </div>
        <div class="p-3 pt-4">
          <h2 class="font-display font-extrabold text-[15px] leading-tight mb-1">소불고기 덮밥</h2>
          <p class="text-[12px] text-foreground-muted leading-snug mb-2 line-clamp-2">양파, 당근을 잘게 썰어 함께 볶기만 하면 돼요.</p>
          <div class="border-t border-dashed border-border pt-2 flex items-center justify-between">
            <span class="inline-flex items-center gap-1 text-[11px] font-display font-bold text-secondary">
              <i class="ph-bold ph-clock"></i>20분
            </span>
            <i class="ph ph-heart text-foreground-muted text-base" aria-hidden="true"></i>
          </div>
        </div>
      </div>
    </div>

    <a href="#" class="mt-5 flex items-center justify-center gap-2 bg-surface border border-border rounded-full shadow-soft py-3 font-display font-bold text-[15px] active:scale-[0.97] transition duration-150">
      <i class="ph-fill ph-play-circle text-lg"></i>
      즐겨찾기 영상 (Recipe Video)
    </a>

    <div class="flex-1"></div>

    <a href="parent-tasks.html"
       class="mt-6 bg-secondary-dark text-on-secondary border-2 border-foreground rounded-md shadow-sticker py-4 flex items-center justify-center gap-2 font-display font-bold text-[17px] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150">
      확인 (To Tasks)
      <i class="ph-bold ph-arrow-right text-lg"></i>
    </a>
  </div>
  <script src="js/store.js"></script>
  <script src="js/bottomnav.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
